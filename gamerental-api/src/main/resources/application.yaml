spring:
  application:
    name: gamerental

  datasource:
    url: jdbc:postgresql://localhost:5432/rental-game-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

app:
  jwt:
    secret: "Z2FtZXJlbnRhbC1zZWNyZXQta2V5LWZvci1qd3QtaHMyNTYtYXV0aGVudGljYXRpb24="
    expiration-ms: 86400000
