spring:
  application:
    name: gamerental

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rental-game-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

app:
  jwt:
    secret: "${JWT_SECRET:Z2FtZXJlbnRhbC1zZWNyZXQta2V5LWZvci1qd3QtaHMyNTYtYXV0aGVudGljYXRpb24=}"
    expiration-ms: 86400000
