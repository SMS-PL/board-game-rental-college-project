<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-3xl font-bold">Gry planszowe</h1>
    <a routerLink="/games/new" class="btn btn-primary">+ Dodaj grę</a>
  </div>

  <div class="flex flex-wrap gap-4 mb-6">
    <div class="form-control">
      <label class="label"><span class="label-text">Filtruj po tagu</span></label>
      <select class="select select-bordered select-sm" [value]="selectedTag" (change)="onTagChange($any($event.target).value)">
        <option value="">Wszystkie</option>
        @for (tag of gameTags; track tag) {
          <option [value]="tag">{{ tag }}</option>
        }
      </select>
    </div>

    <div class="form-control">
      <label class="label"><span class="label-text">Sortuj po</span></label>
      <select class="select select-bordered select-sm" [value]="sortField" (change)="onSortChange($any($event.target).value)">
        <option value="title">Tytule</option>
        <option value="createdAt">Dacie dodania</option>
      </select>
    </div>
  </div>

  @if (isLoading) {
    <div class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  } @else {
    <div class="overflow-x-auto">
      <table class="table table-zebra w-full">
        <thead>
          <tr>
            <th>Tytuł</th>
            <th>Tagi</th>
            <th>Egzemplarze</th>
            <th>Dodano</th>
            <th>Akcje</th>
          </tr>
        </thead>
        <tbody>
          @for (game of games; track game.id) {
            <tr class="hover cursor-pointer" (click)="navigateToDetail(game.id)">
              <td class="font-semibold">{{ game.title }}</td>
              <td>
                <div class="flex flex-wrap gap-1">
                  @for (tag of game.tags; track tag) {
                    <span class="badge badge-outline badge-sm">{{ tag }}</span>
                  }
                </div>
              </td>
              <td>
                <span class="badge badge-primary">{{ game.totalCopies }}</span>
              </td>
              <td>{{ game.createdAt | date:'dd.MM.yyyy' }}</td>
              <td>
                <div class="flex gap-2" (click)="$event.stopPropagation()">
                  <button class="btn btn-ghost btn-xs" (click)="navigateToEdit(game.id, $event)">Edytuj</button>
                  <button class="btn btn-error btn-xs" (click)="openDeleteModal(game.id); $event.stopPropagation()">Usuń</button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center text-base-content/50 py-8">Brak gier</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>

<app-confirm-modal
  [isOpen]="deleteModalOpen"
  title="Usuń grę"
  message="Czy na pewno chcesz usunąć tę grę? Operacja jest nieodwracalna."
  confirmLabel="Usuń"
  (confirmed)="confirmDelete()"
  (cancelled)="cancelDelete()"
/>
