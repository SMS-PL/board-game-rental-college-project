<div class="p-6 max-w-2xl mx-auto">
  <div class="flex items-center gap-4 mb-6">
    <button class="btn btn-ghost btn-sm" routerLink="/games">← Wróć</button>
    <h1 class="text-3xl font-bold">{{ isEditMode ? 'Edytuj grę' : 'Nowa gra' }}</h1>
  </div>

  @if (isLoading) {
    <div class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  } @else {
    <div class="card bg-base-100 shadow">
      <div class="card-body">
        @if (errorMessage) {
          <div class="alert alert-error mb-4">
            <span>{{ errorMessage }}</span>
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="form-control mb-4">
            <label class="label"><span class="label-text font-medium">Tytuł *</span></label>
            <input type="text" formControlName="title" class="input input-bordered" placeholder="Nazwa gry" />
          </div>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text font-medium">Opis *</span></label>
            <textarea formControlName="description" class="textarea textarea-bordered h-28" placeholder="Opis gry..."></textarea>
          </div>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text font-medium">Tagi</span></label>
            <div class="flex flex-wrap gap-2">
              @for (tag of gameTags; track tag) {
                <div
                  class="badge cursor-pointer select-none transition-colors"
                  [class.badge-primary]="isTagSelected(tag)"
                  [class.badge-outline]="!isTagSelected(tag)"
                  (click)="toggleTag(tag)">
                  {{ tag }}
                </div>
              }
            </div>
          </div>

          <div class="form-control mb-6">
            <label class="label"><span class="label-text font-medium">Liczba egzemplarzy *</span></label>
            <input type="number" formControlName="totalCopies" class="input input-bordered w-32" min="1" />
          </div>

          <div class="flex gap-3 justify-end">
            <button type="button" class="btn btn-ghost" routerLink="/games">Anuluj</button>
            <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSaving">
              @if (isSaving) {
                <span class="loading loading-spinner loading-sm"></span>
              } @else {
                {{ isEditMode ? 'Zapisz zmiany' : 'Dodaj grę' }}
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
