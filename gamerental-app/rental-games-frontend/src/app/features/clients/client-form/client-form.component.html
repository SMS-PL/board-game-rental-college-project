<div class="p-6 max-w-2xl mx-auto">
  <div class="flex items-center gap-4 mb-6">
    <button class="btn btn-ghost btn-sm" routerLink="/clients">← Wróć</button>
    <h1 class="text-3xl font-bold">{{ isEditMode ? 'Edytuj klienta' : 'Nowy klient' }}</h1>
  </div>

  @if (isLoading) {
    <div class="flex justify-center py-12">
      <span class="loading loading-spinner loading-lg"></span>
    </div>
  } @else {
    <div class="card bg-base-100 shadow">
      <div class="card-body">
        @if (errorMessage) {
          <div class="alert alert-error mb-4">
            <span>{{ errorMessage }}</span>
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div class="form-control">
              <label class="label"><span class="label-text font-medium">Imię *</span></label>
              <input type="text" formControlName="firstName" class="input input-bordered" placeholder="Jan" />
            </div>
            <div class="form-control">
              <label class="label"><span class="label-text font-medium">Nazwisko *</span></label>
              <input type="text" formControlName="lastName" class="input input-bordered" placeholder="Kowalski" />
            </div>
          </div>

          <div class="form-control mb-4">
            <label class="label"><span class="label-text font-medium">Telefon</span></label>
            <input type="tel" formControlName="phone" class="input input-bordered" placeholder="+48 123 456 789" />
          </div>

          <div class="form-control mb-6">
            <label class="label"><span class="label-text font-medium">Email</span></label>
            <input type="email" formControlName="email" class="input input-bordered" placeholder="jan@example.com" />
            @if (form.get('email')?.invalid && form.get('email')?.touched) {
              <label class="label"><span class="label-text-alt text-error">Nieprawidłowy adres email</span></label>
            }
          </div>

          <div class="flex gap-3 justify-end">
            <button type="button" class="btn btn-ghost" routerLink="/clients">Anuluj</button>
            <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSaving">
              @if (isSaving) {
                <span class="loading loading-spinner loading-sm"></span>
              } @else {
                {{ isEditMode ? 'Zapisz zmiany' : 'Dodaj klienta' }}
              }
            </button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
